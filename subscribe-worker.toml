name = "cidirilk-subscribe"
main = "subscribe-worker.js"
compatibility_date = "2024-11-01"

# Non-secret configuration. Replace the placeholder ids with values from Brevo.
# Secrets are NOT stored here; set them with wrangler secret put:
#   wrangler secret put BREVO_API_KEY -c subscribe-worker.toml
#   wrangler secret put TURNSTILE_SECRET_KEY -c subscribe-worker.toml
[vars]
BREVO_LIST_ID = "4"
BREVO_DOI_TEMPLATE_ID = "2"
DOI_REDIRECT_URL = "https://cidirilk.com/?subscribed=1"

# Per-IP rate limiting with Cloudflare's Rate Limiting binding: 5 requests
# per 60s per IP, checked before anything else. It does not use KV writes, so
# spam cannot exhaust the free plan's 1,000 KV writes/day and break sign-ups.
# namespace_id is any number unique to this limiter in your account.
[[ratelimits]]
name = "SUBSCRIBE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Fallback limiter (KV). Only used if the binding above is removed; it then
# counts after Turnstile passes and fails open.
#   wrangler kv namespace create RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "254014151ac54c9ca19929ce678eac22"
